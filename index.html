const TECH_TREE_POSITIONS = {
  conveyor_systems:    { x:20,  y:20 },
  basic_metallurgy:    { x:210, y:20 },
  basic_logistics:     { x:400, y:20 },
  field_training:      { x:590, y:20 },
  advanced_metallurgy: { x:210, y:140 },
  trade_network:       { x:400, y:140 },
  endurance_training:  { x:590, y:140 },
  industrial_synthesis:{ x:305, y:260 },
};
function techNodeState(node){
  if(hasTech(node.id)) return 'unlocked';
  return node.requires.every(r => hasTech(r)) ? 'available' : 'locked';
}
function renderTechTreeDiagram(){
  const w = 140, h = 50;
  let lines = '';
  TECH_TREE.forEach(node => {
    node.requires.forEach(reqId => {
      const p1 = TECH_TREE_POSITIONS[reqId], p2 = TECH_TREE_POSITIONS[node.id];
      const x1 = p1.x + w/2, y1 = p1.y + h, x2 = p2.x + w/2, y2 = p2.y;
      const active = hasTech(reqId);
      lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${active?'var(--kjerne)':'var(--line)'}" stroke-width="2" ${active?'':'stroke-dasharray="3 3"'}/>`;
    });
  });
  let nodes = '';
  TECH_TREE.forEach(node => {
    const p = TECH_TREE_POSITIONS[node.id];
    const state = techNodeState(node);
    const stroke = state==='unlocked' ? 'var(--kjerne)' : state==='available' ? 'var(--gold)' : 'var(--line)';
    const dash = state==='locked' ? 'stroke-dasharray="4 3"' : '';
    const textColor = state==='locked' ? 'var(--ink-dim)' : 'var(--ink)';
    const opacity = state==='locked' ? '0.6' : '1';
    const mark = state==='unlocked' ? '\u2713 ' : '';
    nodes += `
      <g opacity="${opacity}">
        <rect x="${p.x}" y="${p.y}" width="${w}" height="${h}" rx="5" fill="var(--panel-2)" stroke="${stroke}" stroke-width="2" ${dash}/>
        <text x="${p.x+w/2}" y="${p.y+22}" text-anchor="middle" font-size="11" font-weight="600" fill="${textColor}" font-family="IBM Plex Mono, monospace">${mark}${node.name}</text>
        <text x="${p.x+w/2}" y="${p.y+38}" text-anchor="middle" font-size="9" fill="var(--ink-dim)" font-family="IBM Plex Mono, monospace">Tier ${node.tier}</text>
      </g>`;
  });
  return `<svg viewBox="0 0 750 330" style="width:100%; height:auto; display:block; margin-bottom:16px;">${lines}${nodes}</svg>`;
}

function renderResearch(){
  function nodeCard(node){
    const unlocked = hasTech(node.id);
    const missing = node.requires.filter(r => !hasTech(r));
    const prereqsMet = missing.length === 0;
    const canAfford = canAffordCost(node.cost);
    const prereqNames = node.requires.map(r => TECH_TREE.find(t => t.id === r).name);
    return `
      <div class="market-block" style="${unlocked?'border-left:3px solid var(--kjerne);':''}">
        <h3>${node.name} ${unlocked?'<span style="color:var(--kjerne); font-weight:400;">(Unlocked)</span>':''}</h3>
        <div class="cost-line">${node.desc}</div>
        ${!unlocked ? `
          ${prereqNames.length ? `<div class="cost-line">Requires: ${prereqNames.join(' + ')}</div>` : ''}
          <div class="cost-line">Cost: ${costLineFor(node.cost)}</div>
          <button class="primary small" data-tech="${node.id}" ${(prereqsMet && canAfford)?'':'disabled'}>${!prereqsMet ? 'Locked' : canAfford ? 'Research' : 'Not enough Research'}</button>
        ` : ''}
      </div>`;
  }
  const tiers = [1,2,3].map(tier => `
    <h3 class="section">Tier ${tier}</h3>
    ${TECH_TREE.filter(t => t.tier === tier).map(nodeCard).join('')}
  `).join('');
  return `
    <h2>Research</h2>
    <div class="section-note">Spend Research — earned from Nutrition habits and the occasional lucky find while looting — on permanent bonuses.</div>
    ${renderTechTreeDiagram()}
    ${tiers}
    <div class="feedback" id="researchFeedback"></div>
  `;
}

function renderHistory(){
  let archivedNote = state.archivedSummary.sessions > 0
    ? `<div class="archived-note">+ ${state.archivedSummary.sessions} older sessions archived.</div>` : '';
  if(!state.history.length) return `<h2>History</h2><div class="empty-state">No sessions logged yet.</div>`;
  const catLabel = { cardio:'Cardio', strength:'Strength', flexibility:'Flexibility' };
  const rows = state.history.slice(0,30).map(h => `
    <tr>
      <td>${new Date(h.date).toLocaleDateString('en-GB')}</td>
      <td>${catLabel[h.category]}${h.activityLabel ? ' — ' + h.activityLabel : ''}${h.zoneName ? ' (' + h.zoneName + ')' : ''}</td>
      <td>${h.durationMin} min</td>
      <td>${h.intensity}</td>
      <td style="${h.failed?'color:var(--danger)':''}">${h.resultText}</td>
    </tr>`).join('');
  return `
    <h2>History</h2>
    <table><tr><th>Date</th><th>Type</th><th>Duration</th><th>Intensity</th><th>Yield</th></tr>${rows}</table>
    ${archivedNote}`;
}

function attachPanelHandlers(){
  document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { activeTab = b.dataset.tab; render(); });

  const categorySelect = document.getElementById('categorySelect');
  if(categorySelect) categorySelect.onchange = e => { selectedCategory = e.target.value; render(); };
  const activitySelect = document.getElementById('activitySelect');
  if(activitySelect) activitySelect.onchange = e => { selectedActivity = e.target.value; render(); };
  const zoneSelect = document.getElementById('zoneSelect');
  if(zoneSelect) zoneSelect.onchange = e => { selectedZone = e.target.value; render(); };
  document.querySelectorAll('.intensity-btn').forEach(b => b.onclick = () => { selectedIntensity = b.dataset.int; render(); });

  const logBtn = document.getElementById('logBtn');
  if(logBtn) logBtn.onclick = () => {
    const minutes = parseInt(document.getElementById('minutesInput').value, 10) || 0;
    if(minutes <= 0) return;
    const labelField = document.getElementById('activityLabel');
    const label = selectedCategory==='cardio' ? (selectedActivity==='other' ? (labelField?labelField.value.trim():'') : CARDIO_ACTIVITIES.find(a=>a.id===selectedActivity).label) : null;
    const result = logSession(selectedCategory, minutes, selectedIntensity, label, selectedZone);
    spawnFloatingGain(result.resultText, result.floatColor);
    const box = document.getElementById('feedbackBox');
    if(box){ box.textContent = result.resultText; box.style.display = 'block'; box.className = 'feedback' + (result.failed?' fail':''); }
  };

  const buildBtn = document.getElementById('buildFurnaceBtn');
  if(buildBtn) buildBtn.onclick = () => {
    const result = buildFurnace();
    const fb = document.getElementById('factoryFeedback');
    if(fb){ fb.textContent = result === 'ok' ? 'Furnace built!' : result === 'nocapacity' ? 'Factory is at capacity — expand it first.' : 'Missing resources.'; fb.style.display = 'block'; }
  };
  const upgradeSizeBtn = document.getElementById('upgradeSizeBtn');
  if(upgradeSizeBtn) upgradeSizeBtn.onclick = () => {
    const result = upgradeFactorySize();
    const fb = document.getElementById('factoryFeedback');
    if(fb){ fb.textContent = result === 'ok' ? 'Factory expanded!' : result === 'maxed' ? 'Already at maximum size.' : 'Not enough resources.'; fb.style.display = 'block'; }
  };
  document.querySelectorAll('[data-infra]').forEach(btn => btn.onclick = () => {
    const result = buyInfrastructure(btn.dataset.infra);
    const fb = document.getElementById('factoryFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `${INFRASTRUCTURE[btn.dataset.infra].name} installed!` : result === 'owned' ? 'Already installed.' : 'Not enough resources.';
    fb.style.display = 'block';
  });
  const refineBtn = document.getElementById('refineBtn');
  if(refineBtn) refineBtn.onclick = () => {
    const qty = parseInt(document.getElementById('refineQty').value, 10) || 0;
    const result = refineIron(qty);
    const fb = document.getElementById('factoryFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `Refined ${qty} Iron.` : result === 'nopower' ? 'No power — buy an emergency quota or train Flexibility.' : result === 'nofurnace' ? 'Build the furnace first.' : 'Not enough resources.';
    fb.style.display = 'block';
  };
  document.querySelectorAll('[data-upgrade]').forEach(btn => btn.onclick = () => {
    const result = upgradeFurnace(btn.dataset.upgrade);
    const fb = document.getElementById('factoryFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `Upgraded to ${FURNACE_UPGRADES[btn.dataset.upgrade].name}!` : result === 'alreadyupgraded' ? 'Already upgraded.' : 'Not enough resources.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-build]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.build;
    const result = buildGenericBuilding(id);
    const fb = document.getElementById('factoryFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `${BUILDINGS_DEF[id].name} built!` : result === 'nocapacity' ? 'Factory is at capacity — expand it first.' : result === 'noinfra' ? 'Missing required infrastructure.' : 'Missing resources.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-recipe-building]').forEach(btn => btn.onclick = () => {
    const buildingId = btn.dataset.recipeBuilding, recipeId = btn.dataset.recipeId;
    const qty = parseInt(document.getElementById('recipeQty_'+buildingId+'_'+recipeId).value, 10) || 0;
    const result = refineGenericRecipe(buildingId, recipeId, qty);
    const fb = document.getElementById('factoryFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `Processed ${qty}.` : result === 'nopower' ? 'No power — buy an emergency quota or train Flexibility.' : result === 'nobuilding' ? 'Build it first.' : 'Not enough resources.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-generic-upgrade]').forEach(btn => btn.onclick = () => {
    const [buildingId, upgradeId] = btn.dataset.genericUpgrade.split(':');
    const result = upgradeGenericBuilding(buildingId, upgradeId);
    const fb = document.getElementById('factoryFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `Upgraded to ${BUILDINGS_DEF[buildingId].upgrades[upgradeId].name}!` : result === 'alreadyupgraded' ? 'Already upgraded.' : 'Not enough resources.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-build-turret]').forEach(btn => btn.onclick = () => {
    const tier = btn.dataset.buildTurret;
    const result = buildTurret(tier);
    const fb = document.getElementById('turretFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `${TURRET_DEFS[tier].name} built!` : result === 'nocapacity' ? 'No empty wall slots — expand Factory Size or free one up.' : 'Not enough resources.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-load-ammo]').forEach(btn => btn.onclick = () => {
    const slotIndex = parseInt(btn.dataset.loadAmmo, 10);
    const result = loadAmmo(slotIndex);
    const fb = document.getElementById('turretFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? 'Ammo loaded.' : result === 'full' ? 'Already full.' : 'Not enough of that resource.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-demolish-turret]').forEach(btn => btn.onclick = () => {
    const slotIndex = parseInt(btn.dataset.demolishTurret, 10);
    const result = demolishTurret(slotIndex);
    const fb = document.getElementById('turretFeedback');
    if(!fb) return;
    fb.textContent = result === 'nolabor' ? 'Not enough Labor to demolish.' : (result && result.gold!==undefined) ? `Demolished — got back ${result.gold} Gold.` : 'Could not demolish.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-kind]').forEach(el => el.onclick = () => {
    const kind = el.dataset.kind;
    const value = kind==='slot' ? parseInt(el.dataset.value,10) : el.dataset.value;
    handleFloorNodeClick(kind, value);
  });
  document.querySelectorAll('[data-floor-mode]').forEach(btn => btn.onclick = () => {
    floorMode = btn.dataset.floorMode;
    conveyorSelection = { from:null, to:null };
    slotSelection = null;
    render();
  });
  document.querySelectorAll('[data-demolish-request]').forEach(btn => btn.onclick = () => {
    pendingDemolish = btn.dataset.demolishRequest;
    render();
  });
  document.querySelectorAll('[data-demolish-cancel]').forEach(btn => btn.onclick = () => {
    pendingDemolish = null;
    render();
  });
  document.querySelectorAll('[data-demolish-confirm]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.demolishConfirm;
    pendingDemolish = null;
    const result = demolishBuilding(id);
    const fb = document.getElementById('factoryFeedback');
    if(fb){
      fb.textContent = result === 'nolabor' ? 'Not enough Labor to demolish.' : result === 'notbuilt' ? 'Not built.' : `Demolished — got back ${result.gold} Gold.`;
      fb.style.display = 'block';
    }
  });
  document.querySelectorAll('[data-conveyor-cancel]').forEach(btn => btn.onclick = () => {
    conveyorSelection = { from:null, to:null };
    render();
  });
  const conveyorConfirmBtn = document.getElementById('conveyorConfirmBtn');
  if(conveyorConfirmBtn) conveyorConfirmBtn.onclick = () => {
    const resource = document.getElementById('conveyorResource').value;
    const amount = parseInt(document.getElementById('conveyorAmount').value, 10) || DEFAULT_CONVEYOR_AMOUNT;
    const result = createConveyor(resource, conveyorSelection.to, amount);
    const fb = document.getElementById('factoryFeedback');
    conveyorSelection = { from:null, to:null };
    if(fb){
      fb.textContent = result === 'ok' ? 'Conveyor laid!' : result === 'exists' ? 'Already connected.' : result === 'notech' ? 'Research Conveyor Systems first.' : 'Could not connect.';
      fb.style.display = 'block';
    }
    render();
  };
  document.querySelectorAll('[data-remove-conveyor]').forEach(btn => btn.onclick = () => {
    const [resource, to] = btn.dataset.removeConveyor.split('|');
    removeConveyor(resource, to);
  });
  document.querySelectorAll('[data-nutrition]').forEach(btn => btn.onclick = () => {
    const result = logNutrition(btn.dataset.nutrition);
    const fb = document.getElementById('nutritionFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? 'Logged!' : 'Already logged the max for today.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-gear-tier]').forEach(btn => btn.onclick = () => {
    const category = btn.dataset.gearTier;
    const result = upgradeGearTier(category);
    const fb = document.getElementById('gearFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `${GEAR_TIER_DEFS[category].label} upgraded to Tier ${state.gearTiers[category]}!` : result === 'maxed' ? 'Already at max tier.' : 'Not enough resources.';
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-avatar-style]').forEach(btn => btn.onclick = () => {
    state.avatarStyle = btn.dataset.avatarStyle;
    const firstTime = !state.avatarChosen;
    state.avatarChosen = true;
    saveState();
    if(firstTime) activeTab = 'log';
    render();
  });
  document.querySelectorAll('[data-tech]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.tech;
    const result = unlockTech(id);
    const fb = document.getElementById('researchFeedback');
    if(!fb) return;
    fb.textContent = result === 'ok' ? `${TECH_TREE.find(t=>t.id===id).name} unlocked!` : result === 'already' ? 'Already unlocked.' : result === 'prereq' ? 'Prerequisites not met yet.' : 'Not enough Research.';
    fb.style.display = 'block';
  });

  document.querySelectorAll('[data-sell]').forEach(btn => btn.onclick = () => {
    const key = btn.dataset.sell;
    const qty = parseInt(document.getElementById('sellQty_'+key).value, 10) || 0;
    const result = sellResource(key, qty);
    const fb = document.getElementById('shopFeedback');
    if(!fb) return;
    fb.textContent = result === 'insufficient' ? 'Not enough in stock.' : result === 'nolabor' ? 'Not enough Labor to haul the goods.' : `Sold for +${result.gained} Gold.`;
    fb.style.display = 'block';
  });
  document.querySelectorAll('[data-buy]').forEach(btn => btn.onclick = () => {
    const key = btn.dataset.buy;
    const qty = parseInt(document.getElementById('buyQty_'+key).value, 10) || 0;
    const result = buyResource(key, qty);
    const fb = document.getElementById('shopFeedback');
    if(!fb) return;
    fb.textContent = result === 'insufficient' ? 'Not enough Gold.' : result === 'invalid' ? 'Enter a valid quantity.' : `Bought for -${result.cost} Gold.`;
    fb.style.display = 'block';
  });
}

const resetBtn = document.getElementById('resetBtn');
let resetArmTimeout = null;
resetBtn.onclick = async () => {
  if(!pendingReset){
    pendingReset = true;
    resetBtn.textContent = 'Tap again to confirm reset';
    resetBtn.style.color = 'var(--danger)';
    resetBtn.style.borderColor = 'var(--danger)';
    resetArmTimeout = setTimeout(() => {
      pendingReset = false;
      resetBtn.textContent = 'Reset all progress';
      resetBtn.style.color = '';
      resetBtn.style.borderColor = '';
    }, 4000);
    return;
  }
  clearTimeout(resetArmTimeout);
  pendingReset = false;
  resetBtn.textContent = 'Reset all progress';
  resetBtn.style.color = '';
  resetBtn.style.borderColor = '';
  state = defaultState();
  ensureWeek();
  await saveState();
  render();
};

loadState();
</script>
