<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fitness Factory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0B1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness Factory">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0B1420;
    --panel:#132234;
    --panel-2:#0E1B2A;
    --line:#25415D;
    --ink:#DCE6EE;
    --ink-dim:#7E93A7;
    --gold:#F2C94C;
    --cardio:#5CA6C9;
    --styrke:#9FB1C4;
    --fleks:#D97A52;
    --arbeid:#C9A6E8;
    --energi:#F2C94C;
    --kjerne:#74B085;
    --danger:#E2604C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg-void),var(--bg-void)),
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(37,65,93,0.35) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(37,65,93,0.35) 32px);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:18px;
  }
  .wrap{max-width:1000px;margin:0 auto;}
  .titlebar{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--line);
    padding-bottom:14px; margin-bottom:16px;
    flex-wrap:wrap; gap:12px;
  }
  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800; font-size:38px; letter-spacing:0.5px;
    margin:0; line-height:0.9; color:var(--ink);
  }
  .subtitle{color:var(--ink-dim); font-size:12px; margin-top:4px;}
  .status-block{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
  .readout{font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .readout .icon{width:16px;height:16px;}
  .warn-btn{
    background:var(--danger); color:var(--bg-void); border:none; padding:5px 9px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; cursor:pointer;
  }
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:2px;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  @keyframes beltFlow{to{stroke-dashoffset:-16;}}
  .belt-line{stroke-dasharray:6 4; animation:beltFlow 0.5s linear infinite;}
  .floor-node{cursor:pointer;}
  .floor-node:hover rect{stroke:var(--gold);}
  .floor-node.selected rect{stroke:var(--gold); stroke-width:3;}
  .conveyor-list-row{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); background:var(--panel-2); padding:8px 10px; margin-bottom:6px; font-size:12px;}
  .offline-banner{
    background:var(--danger); color:var(--bg-void); padding:10px 14px; font-size:12.5px; font-weight:600;
    margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }

  .stockpile{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;}
  .stockpile-item{background:var(--panel); border:1px solid var(--line); padding:8px 10px; display:flex; align-items:center; gap:7px;}
  .stockpile-item .label{font-size:10.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stockpile-item .qty{font-size:15px; font-weight:600; margin-left:auto;}

  .icon{display:inline-flex; vertical-align:middle; flex-shrink:0;}
  .icon svg{width:100%; height:100%; display:block;}

  .tabs{display:flex; gap:2px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:9px 14px;
    cursor:pointer; letter-spacing:0.5px;
  }
  .tab-btn.active{background:var(--panel); color:var(--ink); border-bottom:2px solid var(--gold);}
  .tab-btn:hover{color:var(--ink);}

  .panel{background:var(--panel); border:1px solid var(--line); padding:20px; min-height:280px;}
  .panel h2{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:22px;
    margin:0 0 14px 0; color:var(--ink); border-bottom:1px solid var(--line); padding-bottom:8px;
  }
  .panel h3.section{
    font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:17px;
    margin:22px 0 10px; color:var(--ink); display:flex; align-items:center; gap:8px;
  }
  .section-note{font-size:11.5px; color:var(--ink-dim); margin:-4px 0 12px;}
  .zone-flavor{
    font-size:12px; color:var(--ink-dim); font-style:italic; margin:-8px 0 14px;
    border-left:2px solid var(--line); padding-left:10px;
  }
  .zone-flavor.locked{color:var(--danger); font-style:normal; font-weight:600;}

  label{display:block; font-size:11px; color:var(--ink-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px;}
  select, input[type=number], input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size:14px; padding:9px; margin-bottom:14px;
  }
  .row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .intensity-group{display:flex; gap:8px; margin-bottom:14px;}
  .intensity-btn{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    padding:9px; cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  button.primary{
    background:var(--gold); color:var(--bg-void); border:none; padding:12px 18px;
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px; cursor:pointer;
    letter-spacing:0.5px;
  }
  button.primary:hover{opacity:0.9;}
  button.primary:disabled{opacity:0.35; cursor:not-allowed;}
  button.small{padding:7px 12px; font-size:12px;}
  button.ghost{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:8px 12px; font-family:'IBM Plex Mono', monospace; font-size:12px; cursor:pointer;
  }
  .feedback{margin-top:12px; padding:10px; background:var(--panel-2); border-left:3px solid var(--gold); font-size:13px; display:none;}
  .feedback.fail{border-left-color:var(--danger);}

  .resource-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--line); background:var(--panel-2); padding:10px 12px; margin-bottom:8px; flex-wrap:wrap;
  }
  .resource-row .name{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px;}
  .resource-row .qty{font-size:16px; font-weight:600; color:var(--gold); min-width:34px; text-align:right;}
  .resource-row .actionform{display:flex; gap:6px; align-items:center;}
  .resource-row .actionform input{width:64px; margin:0; padding:6px;}

  .market-block{border:1px solid var(--line); background:var(--panel-2); padding:14px; margin-bottom:14px;}
  .market-block h3{font-size:13px; margin:0 0 10px 0; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-dim); display:flex; align-items:center; gap:8px;}
  .cost-line{font-size:11px; color:var(--ink-dim); margin:6px 0 10px;}
  .cost-line span{margin-right:10px;}

  .avatar-card{border:1px solid var(--line); background:var(--panel-2); padding:16px; margin-bottom:14px;}
  .avatar-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .avatar-mult{color:var(--gold); font-size:14px; font-weight:600;}
  .avatar-bar{height:8px; background:var(--panel); border:1px solid var(--line); margin-top:8px;}
  .avatar-bar-fill{height:100%;}
  .avatar-progress-text{font-size:10.5px; color:var(--ink-dim); margin-top:4px;}

  .zone-card{border:1px solid var(--line); background:var(--panel-2); padding:12px 14px; margin-bottom:8px;}
  .zone-card.locked{opacity:0.55;}
  .zone-card .ztop{display:flex; justify-content:space-between; align-items:center;}
  .zone-name{font-weight:600; font-size:14px;}
  .zone-mult{color:var(--gold); font-size:12px;}
  .zone-desc{font-size:11.5px; color:var(--ink-dim); margin-top:4px; font-style:italic;}

  .quest{border:1px solid var(--line); background:var(--panel-2); padding:14px; margin-bottom:10px;}
  .quest.done{border-left:3px solid var(--kjerne);}
  .quest-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:10px;}
  .quest-name{font-weight:600; font-size:14px;}
  .quest-reward{font-size:11px; color:var(--gold); white-space:nowrap;}
  .quest-bar{height:6px; background:var(--panel); border:1px solid var(--line); margin-top:6px;}
  .quest-bar-fill{height:100%; background:var(--kjerne);}
  .quest-progress-text{font-size:10px; color:var(--ink-dim); margin-top:4px;}

  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{text-align:left; padding:6px 4px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-dim); font-weight:500; text-transform:uppercase; font-size:10px;}
  .empty-state{color:var(--ink-dim); font-size:13px; padding:20px 0; text-align:center;}
  .archived-note{font-size:11px; color:var(--ink-dim); margin-top:10px;}

  .footer-reset{text-align:right; margin-top:14px;}

  .float-gain{
    position:fixed; left:50%; top:150px; transform:translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:17px;
    pointer-events:none; animation:floatUp 1.3s ease-out forwards; z-index:60; text-align:center;
  }
  @keyframes floatUp{0%{opacity:0; transform:translate(-50%,10px);}15%{opacity:1;}100%{opacity:0; transform:translate(-50%,-42px);}}

  @media (max-width:640px){
    .row{grid-template-columns:1fr;}
    h1{font-size:28px;}
    .stockpile{grid-template-columns:repeat(2,1fr);}
    .resource-row{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="titlebar">
    <div>
      <h1>FITNESS FACTORY</h1>
      <div class="subtitle">Production facility &mdash; powered by real training</div>
    </div>
    <div class="status-block">
      <div class="readout" style="color:var(--gold);"><span class="icon" id="goldIcon"></span><span id="goldAmount">0</span></div>
      <div class="readout" id="energyReadout"><span class="icon" id="energyIcon"></span><span id="energyAmount">0</span></div>
      <div class="readout" style="color:var(--arbeid);"><span class="icon" id="laborIcon"></span><span id="laborAmount">0</span></div>
    </div>
  </div>

  <div id="offlineBannerSlot"></div>

  <div class="stockpile" id="stockpileStrip"></div>

  <div class="tabs">
    <button class="tab-btn" data-tab="log">LOG SESSION</button>
    <button class="tab-btn" data-tab="avatar">AVATAR</button>
    <button class="tab-btn" data-tab="factory">FACTORY</button>
    <button class="tab-btn" data-tab="shop">SHOP</button>
    <button class="tab-btn" data-tab="contracts">CONTRACTS</button>
    <button class="tab-btn" data-tab="nutrition">NUTRITION</button>
    <button class="tab-btn" data-tab="research">RESEARCH</button>
    <button class="tab-btn" data-tab="zones">ZONES</button>
    <button class="tab-btn" data-tab="history">HISTORY</button>
  </div>

  <div class="panel" id="panelContent"></div>

  <div class="footer-reset"><button class="ghost" id="resetBtn">Reset all progress</button></div>
</div>

function getConveyorRecipes(buildingId){
  if(buildingId === 'furnace') return [{ input:{iron_ore:1}, output:{iron:1} }];

function findRecipeForResource(buildingId, resource){
  const recipes = getConveyorRecipes(buildingId);
  const r = recipes.find(rr => Object.prototype.hasOwnProperty.call(rr.input, resource));
  return r ? (r.id || 'furnace') : null;
}

function isoWeekKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return date.getUTCFullYear() + '-W' + week;
}

function contractRequirementMet(c){
  if(!c.requires) return true;
  const r = c.requires;
  if(r.building && !state.buildings[r.building].built) return false;
  if(r.buildingUpgrade){
    const bs = state.buildings[r.buildingUpgrade.building];
    if(!bs || bs.upgrade !== r.buildingUpgrade.upgrade) return false;
  }
  if(r.zone){
    const z = ZONES.find(zz => zz.id === r.zone);
    if(!z || !isZoneUnlocked(z)) return false;
  }
  if(r.tech && !hasTech(r.tech)) return false;
  return true;
}
function pickWeeklyContracts(weekKey){
  const num = parseInt(weekKey.split('-W')[1], 10) || 1;
  const count = hasTech('endurance_training') ? 3 : 2;
  const eligible = CONTRACT_POOL.filter(contractRequirementMet);
  const n = Math.min(count, eligible.length);
  const idxs = [];
  for(let i = 0; i < n; i++){
    let idx = (num + i * 3) % eligible.length;
    while(idxs.includes(idx)) idx = (idx + 1) % eligible.length;
    idxs.push(idx);
  }
  return idxs.map(i => ({ ...eligible[i], progress:0, completed:false }));
}

async function loadState(){
  try{
    const raw = localStorage.getItem('fitnessfactory_state_v1');
    state = raw ? JSON.parse(raw) : defaultState();
  }catch(e){ state = defaultState(); }
  // migration: furnace used to be a plain boolean
  if(typeof state.buildings.furnace === 'boolean'){
    state.buildings.furnace = { built: state.buildings.furnace, upgrade: null };
  }
  // migration: add any new buildings/resources that didn't exist in older saves
  Object.entries(BUILDINGS_DEF).forEach(([id,b]) => {
    if(!state.buildings[id]) state.buildings[id] = b.upgrades ? { built:false, upgrade:null } : { built:false };
    else if(b.upgrades && state.buildings[id].upgrade === undefined) state.buildings[id].upgrade = null;
  });
  Object.keys(RESOURCE_DEFS).forEach(k => { if(state.resources[k] === undefined) state.resources[k] = 0; });
  if(state.emergencyQuotaBuysThisWeek === undefined) state.emergencyQuotaBuysThisWeek = 0;
  if(!state.nutritionCounts) state.nutritionCounts = { water:0, morning_water:0, no_junk:0, balanced_meal:0 };
  if(state.nutritionDate === undefined) state.nutritionDate = null;
  if(!state.infrastructure) state.infrastructure = { roof:false, grid:false, license:false };
  if(state.factorySizeLevel === undefined) state.factorySizeLevel = 1;
  if(!state.gearTiers) state.gearTiers = { loot:0, labor:0, energy:0, research:0 };
  if(!state.avatarStyle) state.avatarStyle = 'male';
  if(state.hardenedSteelDryStreak === undefined) state.hardenedSteelDryStreak = 0;
  if(state.lootRunsCompleted === undefined) state.lootRunsCompleted = 0;
  if(state.maxZoneTierReached === undefined) state.maxZoneTierReached = 0;
  if(!state.turretAmmo) state.turretAmmo = {};
  if(!state.raidHistory) state.raidHistory = [];
  if(state.gear) delete state.gear; // old flat 4-slot system, replaced by gearTiers
  if(state.avatar.energyMinutesCum === undefined) state.avatar.energyMinutesCum = 0;
  if(state.avatar.researchEarnedCum === undefined) state.avatar.researchEarnedCum = 0;
  if(state.contractsCompletedLifetime === undefined) state.contractsCompletedLifetime = 0;
  if(!state.techUnlocked) state.techUnlocked = {};
  if(!state.conveyors) state.conveyors = [];
  if(!state.factorySlots){
    state.factorySlots = new Array(MAX_TOTAL_SLOTS).fill(null);
    if(state.buildings.furnace && state.buildings.furnace.built) assignToSlot('furnace');
    Object.keys(BUILDINGS_DEF).forEach(id => { if(state.buildings[id] && state.buildings[id].built) assignToSlot(id); });
  }
  if(state.avatarChosen === undefined) state.avatarChosen = true; // existing players skip the first-run picker
  ensureWeek();
  ensureNutritionDay();
  applyEnergyDrain();
  checkStockpileContracts();
  if(!state.avatarChosen) activeTab = 'avatar';
  render();
}
async function saveState(){
  try{ localStorage.setItem('fitnessfactory_state_v1', JSON.stringify(state)); }
  catch(e){ console.error('Save failed', e); }
}
function ensureWeek(){
  const wk = isoWeekKey(new Date());
  if(state.weekKey !== wk){ state.weekKey = wk; state.contracts = pickWeeklyContracts(wk); state.emergencyQuotaBuysThisWeek = 0; }
}
function ensureNutritionDay(){
  const today = new Date().toISOString().slice(0,10);
  if(state.nutritionDate !== today){
    state.nutritionDate = today;
    state.nutritionCounts = { water:0, morning_water:0, no_junk:0, balanced_meal:0 };
  }
}

function getFurnaceDailyDrain(){
  if(!state.buildings.furnace.built) return 0;
  const upg = state.buildings.furnace.upgrade;
  if(upg === 'blast') return FURNACE_UPGRADES.blast.dailyDrain;
  if(upg === 'forge') return FURNACE_UPGRADES.forge.dailyDrain;
  return PER_BUILDING_DRAIN; // baseline, unupgraded furnace
}
function getRefineCost(){
  const upg = state.buildings.furnace.upgrade;
  if(upg === 'blast') return FURNACE_UPGRADES.blast.refineCost;
  if(upg === 'forge') return FURNACE_UPGRADES.forge.refineCost;
  return REFINE_COST_PER_UNIT; // baseline, unupgraded furnace
}
function meetsRequirement(b){
  if(!b.requires) return true;
  const reqBs = state.buildings[b.requires.building];
  return !!reqBs && reqBs.upgrade === b.requires.upgrade;
}
function meetsInfrastructure(b){
  if(!b.requiresInfrastructure) return true;
  return b.requiresInfrastructure.every(key => state.infrastructure[key]);
}
function isWorkshopUnlocked(){
  const mainBuilt = MAIN_FLOOR_IDS.filter(id => state.buildings[id].built).length;
  return mainBuilt >= 2 || state.contractsCompletedLifetime >= 3;
}
function countBuiltBuildings(){
  return state.factorySlots.filter(s => s !== null).length;
}
function getInteriorCapacity(){ return FACTORY_SIZE_LEVELS[state.factorySizeLevel-1].interior; }
function getWallCapacity(){ return FACTORY_SIZE_LEVELS[state.factorySizeLevel-1].wall; }
function isSlotUnlocked(index){
  if(slotIsWall(index)) return (index - MAX_INTERIOR_SLOTS) < getWallCapacity();
  return index < getInteriorCapacity();
}
function findEmptySlotIndex(id){
  // Regular buildings prefer Interior, overflow into Wall once Interior is full.
  // Wall-only building types (future turrets) search only the Wall range.
  if(!buildingRequiresWall(id)){
    for(let i=0; i<MAX_INTERIOR_SLOTS; i++){ if(isSlotUnlocked(i) && !state.factorySlots[i]) return i; }
  }
  for(let i=MAX_INTERIOR_SLOTS; i<MAX_TOTAL_SLOTS; i++){ if(isSlotUnlocked(i) && !state.factorySlots[i]) return i; }
  return -1;
}
function assignToSlot(id){
  const idx = findEmptySlotIndex(id);
  if(idx === -1) return false;
  state.factorySlots[idx] = id;
  return true;
}
function freeSlotFor(id){
  const idx = state.factorySlots.indexOf(id);
  if(idx !== -1) state.factorySlots[idx] = null;
}
function swapSlots(indexA, indexB){
  if(indexA === indexB) return 'same';
  if(!isSlotUnlocked(indexA) || !isSlotUnlocked(indexB)) return 'locked';
  const a = state.factorySlots[indexA], b = state.factorySlots[indexB];
  if(a && buildingRequiresWall(a) && !slotIsWall(indexB)) return 'invalid';
  if(b && buildingRequiresWall(b) && !slotIsWall(indexA)) return 'invalid';
  state.factorySlots[indexA] = b;
  state.factorySlots[indexB] = a;
  saveState(); render();
  return 'ok';
}
function buyInfrastructure(key){
  if(state.infrastructure[key]) return 'owned';
  const inf = INFRASTRUCTURE[key];
  if(!canAffordCost(inf.cost)) return 'insufficient';
  payCost(inf.cost);
  state.infrastructure[key] = true;
  saveState(); render();
  return 'ok';
}
function upgradeFactorySize(){
  const nextIndex = state.factorySizeLevel; // level L is array index L-1, so this is the next tier
  if(nextIndex >= FACTORY_SIZE_LEVELS.length) return 'maxed';
  const cost = FACTORY_SIZE_LEVELS[nextIndex].upgradeCost;
  if(!canAffordCost(cost)) return 'insufficient';
  payCost(cost);
  state.factorySizeLevel += 1;
  saveState(); render();
  return 'ok';
}
function hasTech(id){ return !!state.techUnlocked[id]; }
function getBonusMultiplier(kind){
  let mult = 1;
  TECH_TREE.forEach(t => { if(hasTech(t.id) && t.effect[kind]) mult += t.effect[kind]; });
  return mult;
}
function upgradeGearTier(category){
  const current = state.gearTiers[category];
  const nextTier = current + 1;
  if(nextTier > 4) return 'maxed';
  const def = GEAR_TIER_DEFS[category];
  const cost = { [def.resource]: def.tierCosts[nextTier-1] };
  if(!canAffordCost(cost)) return 'insufficient';
  payCost(cost);
  state.gearTiers[category] = nextTier;
  saveState(); render();
  return 'ok';
}
function unlockTech(id){
  const node = TECH_TREE.find(t => t.id === id);
  if(hasTech(id)) return 'already';
  if(node.requires.some(r => !hasTech(r))) return 'prereq';
  if(!canAffordCost(node.cost)) return 'insufficient';
  payCost(node.cost);
  state.techUnlocked[id] = true;
  saveState(); render();
  return 'ok';
}
function getActiveUpgrade(id){
  const b = BUILDINGS_DEF[id];
  const bs = state.buildings[id];
  return (b.upgrades && bs.upgrade) ? b.upgrades[bs.upgrade] : null;
}
function getGenericBuildingsDrain(){
  let total = 0;
  Object.entries(BUILDINGS_DEF).forEach(([id, b]) => {
    if(!state.buildings[id].built) return;
    const upg = getActiveUpgrade(id);
    total += upg ? upg.dailyDrain : b.baseDrain;
  });
  return total;
}
function getPassiveEnergyGen(){
  let total = 0;
  Object.entries(BUILDINGS_DEF).forEach(([id, b]) => {
    if(state.buildings[id].built && b.passiveEnergyGen) total += b.passiveEnergyGen;
  });
  return total;
}
function getValidResourcesForConnection(from, to){
  let candidates;
  if(from === 'loot'){
    candidates = ['iron_ore','coal','stone','silver','gold_ore','diamond','hardened_steel'];
  } else {
    candidates = [];
    getConveyorRecipes(from).forEach(r => Object.keys(r.output).forEach(k => candidates.push(k)));
  }
  if(to === 'trader') return candidates;
  if(isTurretSlotRef(to)){
    const v = state.factorySlots[turretSlotIndexFromRef(to)];
    if(!v || !isTurretSlotValue(v)) return [];
    const ammoResource = TURRET_DEFS[turretTierFromSlotValue(v)].ammoResource;
    return candidates.filter(r => r === ammoResource);
  }
  const toInputs = new Set();
  getConveyorRecipes(to).forEach(r => Object.keys(r.input).forEach(k => toInputs.add(k)));
  return candidates.filter(r => toInputs.has(r));
}
const DEFAULT_CONVEYOR_AMOUNT = 5;
function createConveyor(resource, to, amount){
  if(!hasTech('conveyor_systems')) return 'notech';
  if(to !== 'trader'){
    if(isTurretSlotRef(to)){
      const v = state.factorySlots[turretSlotIndexFromRef(to)];
      if(!v || !isTurretSlotValue(v)) return 'nobuilding';
      if(TURRET_DEFS[turretTierFromSlotValue(v)].ammoResource !== resource) return 'incompatible';
    } else {
      const bs = state.buildings[to];
      if(!bs || !bs.built) return 'nobuilding';
      if(!findRecipeForResource(to, resource)) return 'incompatible';
    }
  }
  if(state.conveyors.some(c => c.resource === resource && c.to === to)) return 'exists';
  state.conveyors.push({ resource, to, amount: Math.max(1, amount||DEFAULT_CONVEYOR_AMOUNT) });
  saveState(); render();
  return 'ok';
}
function removeConveyor(resource, to){
  state.conveyors = state.conveyors.filter(c => !(c.resource === resource && c.to === to));
  saveState(); render();
  return 'ok';
}
function maxAffordableQty(buildingId, recipeId, cap){
  if(buildingId === 'furnace'){
    const cost = getRefineCost();
    let max = Math.min(cap, state.resources.iron_ore);
    if(cost.labor>0) max = Math.min(max, Math.floor(state.labor/cost.labor));
    if(cost.energy>0) max = Math.min(max, Math.floor(state.energy/cost.energy));
    return Math.max(0, max);
  }
  const b = BUILDINGS_DEF[buildingId];
  const recipe = b.recipes.find(r => r.id === recipeId);
  const activeUpgrade = getActiveUpgrade(buildingId);
  const cost = (activeUpgrade && activeUpgrade.recipeOverride) ? activeUpgrade.recipeOverride : recipe.cost;
  let max = cap;
  Object.entries(recipe.input).forEach(([k,amt]) => { max = Math.min(max, Math.floor(getCurrentStock(k)/amt)); });
  if(cost.labor>0) max = Math.min(max, Math.floor(state.labor/cost.labor));
  if(cost.energy>0) max = Math.min(max, Math.floor(state.energy/cost.energy));
  return Math.max(0, max);
}
function processConveyorsForDays(days){
  for(let d = 0; d < days; d++){
    state.conveyors.forEach(conv => {
      const amount = conv.amount || 1;
      if(conv.to === 'trader'){
        const qty = Math.min(amount, state.resources[conv.resource]||0);
        if(qty > 0){
          state.resources[conv.resource] -= qty;
          const gained = Math.round(qty * RESOURCE_DEFS[conv.resource].sell * getBonusMultiplier('sell'));
          state.gold += gained;
          updateContractProgress('sell', { resource:conv.resource, amount:qty });
        }
        return;
      }
      if(isTurretSlotRef(conv.to)){
        const slotIdx = turretSlotIndexFromRef(conv.to);
        const v = state.factorySlots[slotIdx];
        if(!v || !isTurretSlotValue(v)) return;
        const def = TURRET_DEFS[turretTierFromSlotValue(v)];
        const current = state.turretAmmo[slotIdx] || 0;
        const room = def.ammoCap - current;
        const qty = Math.min(amount, room, getCurrentStock(conv.resource));
        if(qty > 0){ spendStock(conv.resource, qty); state.turretAmmo[slotIdx] = current + qty; }
        return;
      }
      const bs = state.buildings[conv.to];
      if(!bs || !bs.built || state.energy <= 0) return;
      if(conv.to === 'furnace'){
        const qty = maxAffordableQty('furnace', null, amount);
        if(qty > 0) tryProcessFurnaceUnits(qty);
        return;
      }
      const recipeId = findRecipeForResource(conv.to, conv.resource);
      if(!recipeId) return;
      const qty = maxAffordableQty(conv.to, recipeId, amount);
      if(qty > 0) tryProcessGenericUnits(conv.to, recipeId, qty);
    });
  }
}
function applyEnergyDrain(){
  if(!state.lastEnergyCheckISO){ state.lastEnergyCheckISO = new Date().toISOString(); return; }
  const days = Math.floor((Date.now() - new Date(state.lastEnergyCheckISO).getTime()) / 86400000);
  if(days <= 0) return;
  processConveyorsForDays(days);
  const netDaily = getPassiveEnergyGen() - (BASE_DAILY_DRAIN + getFurnaceDailyDrain() + getGenericBuildingsDrain());
  state.energy = Math.max(0, state.energy + netDaily * days);
  state.lastEnergyCheckISO = new Date().toISOString();
}

function getCurrentStock(resource){
  if(resource === 'energy') return state.energy;
  if(resource === 'labor') return state.labor;
  if(resource === 'gold') return state.gold;
  return state.resources[resource] || 0;
}
function spendStock(resource, amount){
  if(resource === 'energy') state.energy -= amount;
  else if(resource === 'labor') state.labor -= amount;
  else if(resource === 'gold') state.gold -= amount;
  else state.resources[resource] -= amount;
}
function canAffordCost(costObj){
  return Object.entries(costObj).every(([k,amt]) => getCurrentStock(k) >= amt);
}
function payCost(costObj){
  Object.entries(costObj).forEach(([k,amt]) => spendStock(k, amt));
}
function buildGenericBuilding(id){
  const b = BUILDINGS_DEF[id];
  if(!meetsRequirement(b)) return 'locked';
  if(!meetsInfrastructure(b)) return 'noinfra';
  const bs = state.buildings[id];
  if(bs.built) return 'owned';
  if(findEmptySlotIndex(id) === -1) return 'nocapacity';
  if(!canAffordCost(b.buildCost)) return 'insufficient';
  payCost(b.buildCost);
  if(b.buildCost.labor) state.avatar.strengthLaborSpentCum += b.buildCost.labor;
  bs.built = true;
  assignToSlot(id);
  saveState(); render();
  return 'ok';
}
function upgradeGenericBuilding(id, upgradeId){
  const b = BUILDINGS_DEF[id];
  const bs = state.buildings[id];
  if(!bs.built) return 'nobuilding';
  if(bs.upgrade) return 'alreadyupgraded';
  const upg = b.upgrades[upgradeId];
  if(!upg) return 'invalid';
  if(!canAffordCost(upg.cost)) return 'insufficient';
  payCost(upg.cost);
  bs.upgrade = upgradeId;
  saveState(); render();
  return 'ok';
}
function calcRefundValue(buildCost, upgradeCost){
  let refund = 0;
  const addCost = (costObj) => {
    Object.entries(costObj).forEach(([k,amt]) => {
      if(k === 'gold') refund += amt;
      else if(k !== 'labor' && k !== 'energy' && RESOURCE_DEFS[k]) refund += amt * RESOURCE_DEFS[k].sell;
    });
  };
  addCost(buildCost);
  if(upgradeCost) addCost(upgradeCost);
  return Math.round(refund * DEMOLISH_REFUND_RATE);
}
function getDemolishRefund(id){
  if(id === 'furnace'){
    const upgCost = state.buildings.furnace.upgrade ? FURNACE_UPGRADES[state.buildings.furnace.upgrade].cost : null;
    return calcRefundValue(FURNACE_BUILD_COST, upgCost);
  }
  const b = BUILDINGS_DEF[id], bs = state.buildings[id];
  const upgCost = (bs.upgrade && b.upgrades) ? b.upgrades[bs.upgrade].cost : null;
  return calcRefundValue(b.buildCost, upgCost);
}
function renderDemolishControl(id){
  const refund = getDemolishRefund(id);
  if(pendingDemolish === id){
    return ` <span style="color:var(--danger); font-weight:600; font-size:12px; margin-left:8px;">Sure? Get ${refund}g back, can't undo</span> <button class="primary small" data-demolish-confirm="${id}" style="margin-left:4px;">Yes, demolish</button> <button class="ghost small" data-demolish-cancel="1" style="margin-left:4px;">Cancel</button>`;
  }
  return `<button class="ghost small" data-demolish-request="${id}" style="margin-left:8px;">Demolish (~${refund}g back)</button>`;
}
function demolishBuilding(id){
  const built = id === 'furnace' ? state.buildings.furnace.built : (state.buildings[id] && state.buildings[id].built);
  if(!built) return 'notbuilt';
  if(state.labor < DEMOLISH_LABOR_COST) return 'nolabor';
  const refund = getDemolishRefund(id);
  state.labor -= DEMOLISH_LABOR_COST;
  state.gold += refund;
  if(id === 'furnace'){ state.buildings.furnace = { built:false, upgrade:null }; }
  else { const b = BUILDINGS_DEF[id]; state.buildings[id] = b.upgrades ? { built:false, upgrade:null } : { built:false }; }
  state.conveyors = state.conveyors.filter(c => c.to !== id && RESOURCE_SOURCE_BUILDING[c.resource] !== id);
  freeSlotFor(id);
  saveState(); render();
  return { gold: refund };
}

// --- Turrets ---
function getBuiltTurrets(){
  const list = [];
  state.factorySlots.forEach((v,i) => { if(isTurretSlotValue(v)) list.push({ slotIndex:i, tier:turretTierFromSlotValue(v), def:TURRET_DEFS[turretTierFromSlotValue(v)] }); });
  return list;
}
function buildTurret(tier){
  const def = TURRET_DEFS[tier];
  if(!def) return 'invalid';
  if(!canAffordCost(def.buildCost)) return 'insufficient';
  const slotValue = 'turret:' + tier;
  const idx = findEmptySlotIndex(slotValue);
  if(idx === -1) return 'nocapacity';
  payCost(def.buildCost);
  state.factorySlots[idx] = slotValue;
  state.turretAmmo[idx] = 0;
  saveState(); render();
  return 'ok';
}
function demolishTurret(slotIndex){
  const v = state.factorySlots[slotIndex];
  if(!isTurretSlotValue(v)) return 'notbuilt';
  if(state.labor < DEMOLISH_LABOR_COST) return 'nolabor';
  const tier = turretTierFromSlotValue(v);
  const refund = calcRefundValue(TURRET_DEFS[tier].buildCost, null);
  state.labor -= DEMOLISH_LABOR_COST;
  state.gold += refund;
  state.factorySlots[slotIndex] = null;
  delete state.turretAmmo[slotIndex];
  state.conveyors = state.conveyors.filter(c => c.to !== 'turretslot:'+slotIndex);
  saveState(); render();
  return { gold: refund };
}
function loadAmmo(slotIndex){
  const v = state.factorySlots[slotIndex];
  if(!isTurretSlotValue(v)) return 'notbuilt';
  const def = TURRET_DEFS[turretTierFromSlotValue(v)];
  const current = state.turretAmmo[slotIndex] || 0;
  const room = def.ammoCap - current;
  if(room <= 0) return 'full';
  const qty = Math.min(AMMO_LOAD_AMOUNT, room);
  if(getCurrentStock(def.ammoResource) < qty) return 'insufficient';
  spendStock(def.ammoResource, qty);
  state.turretAmmo[slotIndex] = current + qty;
  saveState(); render();
  return 'ok';
}

// --- Raids ---
// Tuned against TURRET_DEFS single-turret output [8, 16, 40, 80, 150]: each wave sits strictly
// above 2x the previous tier's output and at/below 3x it, so "3 of the previous tier" is the
// exact threshold that clears the next zone tier up — 2 always falls short. Tier 1 stays at
// 4 HP per the original "doesn't get a lot harder on level 1" call.
const RAID_WAVE_TABLE = [
  { raiderCount:2,  raiderHP:2 },   // 4    (vs Scrap Launcher 8 — solos with margin)
  { raiderCount:3,  raiderHP:6 },   // 18   (2x8=16 short, 3x8=24 clears)
  { raiderCount:5,  raiderHP:8 },   // 40   (2x16=32 short, 3x16=48 clears)
  { raiderCount:10, raiderHP:10 },  // 100  (2x40=80 short, 3x40=120 clears)
  { raiderCount:10, raiderHP:20 },  // 200  (2x80=160 short, 3x80=240 clears)
];
function computeWaveStats(zoneTierIndex){
  const t = RAID_WAVE_TABLE[Math.min(zoneTierIndex, RAID_WAVE_TABLE.length-1)];
  return { raiderCount:t.raiderCount, raiderHP:t.raiderHP, totalHP:t.raiderCount*t.raiderHP };
}
function applyRaidConsequence(zoneTierIndex){
  const roll = Math.random();
  if(roll < 0.5){
    const raw = ['iron_ore','coal','stone'].filter(r => state.resources[r] > 0);
    if(raw.length === 0) return { type:'nothing' };
    const target = raw[Math.floor(Math.random()*raw.length)];
    const stolenPct = 0.15 + zoneTierIndex*0.08;
    const amount = Math.max(1, Math.round(state.resources[target]*stolenPct));
    state.resources[target] -= amount;
    return { type:'stolen', resource:target, amount };
  }
  if(roll < 0.85){
    const turrets = getBuiltTurrets();
    if(turrets.length === 0) return applyRaidConsequence(zoneTierIndex);
    const victim = turrets[Math.floor(Math.random()*turrets.length)];
    state.factorySlots[victim.slotIndex] = null;
    delete state.turretAmmo[victim.slotIndex];
    state.conveyors = state.conveyors.filter(c => c.to !== 'turretslot:'+victim.slotIndex);
    return { type:'turret_destroyed', tier:victim.tier, name:TURRET_DEFS[victim.tier].name };
  }
  const candidates = [];
  state.factorySlots.forEach((v,i) => { if(v && !isTurretSlotValue(v)) candidates.push(v); });
  if(candidates.length === 0) return applyRaidConsequence(zoneTierIndex);
  const victimId = candidates[Math.floor(Math.random()*candidates.length)];
  const name = getNodeDisplayLabel(victimId);
  if(victimId === 'furnace'){ state.buildings.furnace = { built:false, upgrade:null }; }
  else { const b = BUILDINGS_DEF[victimId]; state.buildings[victimId] = b.upgrades ? { built:false, upgrade:null } : { built:false }; }
  freeSlotFor(victimId);
  state.conveyors = state.conveyors.filter(c => c.to !== victimId && RESOURCE_SOURCE_BUILDING[c.resource] !== victimId);
  return { type:'building_destroyed', building:victimId, name };
}
function resolveRaid(zoneTierIndex){
  const wave = computeWaveStats(zoneTierIndex);
  let remaining = wave.totalHP;
  const turrets = getBuiltTurrets();
  const shotsFired = {};
  turrets.forEach(t => { shotsFired[t.slotIndex] = 0; });
  for(let tick=0; tick<RAID_APPROACH_TICKS && remaining>0; tick++){
    let dmg = 0;
    turrets.forEach(t => {
      if(shotsFired[t.slotIndex] >= t.def.shotsPerRaid) return;
      const ammo = state.turretAmmo[t.slotIndex] || 0;
      if(ammo >= AMMO_PER_SHOT){
        state.turretAmmo[t.slotIndex] = ammo - AMMO_PER_SHOT;
        shotsFired[t.slotIndex] += 1;
        dmg += t.def.damage;
      }
    });
    remaining -= dmg;
  }
  const repelled = remaining <= 0;
  const consequence = repelled ? null : applyRaidConsequence(zoneTierIndex);
  const result = { repelled, wave, consequence, zoneTierIndex };
  state.raidHistory.unshift({ date:new Date().toISOString(), lootRunNumber: state.lootRunsCompleted, ...result });
  if(state.raidHistory.length > 20) state.raidHistory = state.raidHistory.slice(0,20);
  return result;
}
function maybeTriggerRaid(zoneTierIndex){
  state.lootRunsCompleted += 1;
  if(zoneTierIndex > state.maxZoneTierReached) state.maxZoneTierReached = zoneTierIndex;
  if(state.lootRunsCompleted <= RAID_GRACE_RUNS) return null;
  if(Math.random() >= RAID_CHANCE) return null;
  return resolveRaid(state.maxZoneTierReached);
}

function tryProcessGenericUnits(buildingId, recipeId, qty){
  const b = BUILDINGS_DEF[buildingId];
  const recipe = b.recipes.find(r => r.id === recipeId);
  const activeUpgrade = getActiveUpgrade(buildingId);
  const effectiveCost = (activeUpgrade && activeUpgrade.recipeOverride) ? activeUpgrade.recipeOverride : recipe.cost;
  const inputNeeds = {};
  Object.entries(recipe.input).forEach(([k,amt]) => { inputNeeds[k] = amt * qty; });
  const laborCost = effectiveCost.labor * qty;
  const energyCost = effectiveCost.energy * qty;
  for(const [k,amt] of Object.entries(inputNeeds)){ if(getCurrentStock(k) < amt) return false; }
  if(state.labor < laborCost || state.energy < energyCost) return false;
  Object.entries(inputNeeds).forEach(([k,amt]) => spendStock(k, amt));
  state.labor -= laborCost;
  state.energy -= energyCost;
  state.avatar.strengthLaborSpentCum += laborCost;
  Object.entries(recipe.output).forEach(([k,amt]) => {
    state.resources[k] = (state.resources[k]||0) + amt * qty;
    updateContractProgress('refine', { resource:k, amount: amt * qty });
  });
  if(activeUpgrade && activeUpgrade.byproductChance){
    for(let i=0;i<qty;i++){
      if(Math.random() < activeUpgrade.byproductChance){
        state.resources[activeUpgrade.byproductResource] = (state.resources[activeUpgrade.byproductResource]||0) + 1;
      }
    }
  }
  return true;
}
function refineGenericRecipe(buildingId, recipeId, qty){
  const bs = state.buildings[buildingId];
  if(!bs.built) return 'nobuilding';
  if(state.energy <= 0) return 'nopower';
  if(qty <= 0) return 'invalid';
  if(!tryProcessGenericUnits(buildingId, recipeId, qty)) return 'insufficient';
  checkStockpileContracts();
  saveState(); render();
  return 'ok';
}

function checkStockpileContracts(){
  state.contracts.forEach(c => {
    if(c.metric !== 'stockpile' || c.completed) return;
    const cur = getCurrentStock(c.resource);
    c.progress = Math.min(c.target, cur);
    if(cur >= c.target){ c.completed = true; state.gold += c.rewardGold; state.contractsCompletedLifetime = (state.contractsCompletedLifetime||0) + 1; }
  });
}

function getAvatarLevel(levels, cumValue){
  let lvl = 0;
  levels.forEach((l,i) => { if(cumValue >= l.min) lvl = i; });
  return lvl;
}
function getEffectiveLevel(levels, cumValue, gearTier){
  return Math.min(levels.length - 1, getAvatarLevel(levels, cumValue) + (gearTier || 0));
}
function getAvatarSpeedMult(){ return SPEED_LEVELS[getEffectiveLevel(SPEED_LEVELS, state.avatar.speedMinutesCum, state.gearTiers.loot)].mult; }
function getAvatarStrengthMult(){ return STRENGTH_LEVELS[getEffectiveLevel(STRENGTH_LEVELS, state.avatar.strengthLaborSpentCum, state.gearTiers.labor)].mult; }
function getAvatarEnergyMult(){ return ENERGY_LEVELS[getEffectiveLevel(ENERGY_LEVELS, state.avatar.energyMinutesCum, state.gearTiers.energy)].mult; }
function getAvatarResearchMult(){ return RESEARCH_LEVELS[getEffectiveLevel(RESEARCH_LEVELS, state.avatar.researchEarnedCum, state.gearTiers.research)].mult; }
function getCurrentSpeedLevel(){ return getEffectiveLevel(SPEED_LEVELS, state.avatar.speedMinutesCum, state.gearTiers.loot); }
function isZoneUnlocked(zone){ return getCurrentSpeedLevel() >= zone.requiredSpeedLevel; }

function computeLoot(durationMin, intensity, zoneId){
  const zone = ZONES.find(z => z.id === zoneId) || ZONES[0];
  if(!isZoneUnlocked(zone)){
    const gap = zone.requiredSpeedLevel - getCurrentSpeedLevel(); // levels short (>=1 here)
    const salvageChance = Math.max(SALVAGE_CHANCE_FLOOR, SALVAGE_CHANCE_BASE - SALVAGE_CHANCE_DECAY * (gap - 1));
    const salvageMult = SALVAGE_MULT_BASE / gap;
    if(Math.random() < salvageChance){
      const salvageIntensityMult = INTENSITY_MULT[intensity];
      const salvagePower = LOOT_K * Math.pow(durationMin, LOOT_DURATION_EXPONENT) * salvageIntensityMult * getAvatarSpeedMult() * salvageMult;
      const salvageUnits = Math.max(0, Math.round(salvagePower));
      const sw = [0.45, 0.30, 0.25].map(w => w * (0.7 + Math.random() * 0.6));
      const sSum = sw.reduce((a,b) => a+b, 0);
      const sNorm = sw.map(w => w / sSum);
      let s0 = Math.round(sNorm[0]*salvageUnits), s1 = Math.round(sNorm[1]*salvageUnits);
      let s2 = salvageUnits - s0 - s1;
      if(s2 < 0){ s2 = 0; }
      return { basics:{iron_ore:s0,coal:s1,stone:s2}, premium:null, rareFind:false, failed:true, salvaged:true, zone, gap };
    }
    return { basics:{iron_ore:0,coal:0,stone:0}, premium:null, rareFind:false, failed:true, salvaged:false, zone };
  }
  const intensityMult = INTENSITY_MULT[intensity];
  const lootPower = LOOT_K * Math.pow(durationMin, LOOT_DURATION_EXPONENT) * intensityMult * getAvatarSpeedMult() * zone.lootMult * getBonusMultiplier('loot');
  const basicUnits = Math.max(1, Math.round(lootPower));
  const rawWeights = [0.45, 0.30, 0.25].map(w => w * (0.7 + Math.random() * 0.6));
  const sum = rawWeights.reduce((a,b) => a+b, 0);
  const norm = rawWeights.map(w => w / sum);
  let u0 = Math.round(norm[0]*basicUnits), u1 = Math.round(norm[1]*basicUnits);
  let u2 = basicUnits - u0 - u1;
  if(u2 < 0){ u2 = 0; }
  const basics = { iron_ore:u0, coal:u1, stone:u2 };

  const premiumChance = Math.min(0.35, 0.004 * durationMin * intensityMult * zone.lootMult); // was capping at 75% by 50min — too common for a "premium" find
  let premium = null;
  if(Math.random() < premiumChance){
    const roll = Math.random();
    premium = roll < 0.6 ? 'silver' : roll < 0.9 ? 'gold_ore' : 'diamond';
  }
  const rareChance = Math.min(0.07, 0.0009 * durationMin * zone.lootMult); // was capped at 5%/0.0006 — raised a bit per player feedback
  const rareRoll = Math.random() < rareChance;
  const pityTriggered = !rareRoll && (state.hardenedSteelDryStreak + 1) >= PITY_THRESHOLD;
  const rareFind = rareRoll || pityTriggered;
  const researchChance = Math.min(0.15, 0.002 * durationMin * zone.lootMult);
  const researchFound = Math.random() < researchChance ? 1 + Math.floor(Math.random()*2) : 0;
  const openGearCategories = GEAR_CATEGORIES.filter(c => state.gearTiers[c] < 4);
  const gearDropChance = (GEAR_DROP_ZONES.includes(zone.id) && openGearCategories.length > 0)
    ? Math.min(GEAR_DROP_CHANCE_CAP, GEAR_DROP_COEFFICIENT * durationMin * zone.lootMult) : 0;
  const gearDrop = Math.random() < gearDropChance ? openGearCategories[Math.floor(Math.random()*openGearCategories.length)] : null;
  return { basics, premium, rareFind, pityTriggered, researchFound, gearDrop, failed:false, zone };
}

function updateContractProgress(metric, payload){
  state.contracts.forEach(c => {
    if(c.completed || c.metric !== metric) return;
    if(metric === 'sell' && c.resource === payload.resource) c.progress += payload.amount;
    if(metric === 'refine' && c.resource === payload.resource) c.progress += payload.amount;
    if(metric === 'labor') c.progress += payload.amount;
    if(metric === 'energy') c.progress += payload.amount;
    if(metric === 'premiumfind') c.progress += payload.amount;
    if(metric === 'zonetier' && payload.zoneTierIndex >= c.minTier) c.progress += 1;
    if(c.progress >= c.target){ c.completed = true; state.gold += c.rewardGold; state.contractsCompletedLifetime = (state.contractsCompletedLifetime||0) + 1; }
  });
}

function trimHistory(){
  if(state.history.length > 150){
    state.archivedSummary.sessions += state.history.length - 150;
    state.history = state.history.slice(0, 150);
  }
}

function logSession(category, durationMin, intensity, activityLabel, zoneId){
  let resultText = '';
  let floatColor = '#F2C94C';
  let failed = false;
  if(category === 'cardio'){
    const loot = computeLoot(durationMin, intensity, zoneId);
    failed = loot.failed;
    Object.entries(loot.basics).forEach(([k,v]) => { state.resources[k] += v; });
    if(loot.failed){
      if(loot.salvaged){
        const scrapParts = Object.entries(loot.basics).filter(([k,v])=>v>0).map(([k,v]) => `+${v} ${RESOURCE_DEFS[k].label}`);
        resultText = `You weren't ready for ${loot.zone.name}, but scraped together a little: ${scrapParts.join(', ') || 'barely anything'}. (Speed minutes still counted.)`;
      } else {
        resultText = `You weren't ready for ${loot.zone.name} — came back empty-handed. (Speed minutes still counted.)`;
      }
      floatColor = 'var(--danger)';
    } else {
      let parts = Object.entries(loot.basics).filter(([k,v])=>v>0).map(([k,v]) => `+${v} ${RESOURCE_DEFS[k].label}`);
      if(loot.premium){ state.resources[loot.premium] += 1; parts.push(`+1 ${RESOURCE_DEFS[loot.premium].label}!`); }
      if(loot.rareFind){
        state.resources.hardened_steel += 1;
        state.hardenedSteelDryStreak = 0;
        parts.push(loot.pityTriggered ? `+1 Hardened Steel — persistence pays off!` : `+1 Hardened Steel — rare find!`);
      } else {
        state.hardenedSteelDryStreak += 1;
      }
      if(loot.researchFound){ const rGain = Math.round(loot.researchFound * getAvatarResearchMult()); state.resources.research = (state.resources.research||0) + rGain; state.avatar.researchEarnedCum += rGain; parts.push(`+${rGain} Research`); }
      if(loot.gearDrop){ state.gearTiers[loot.gearDrop] += 1; parts.push(`⭐ INSANE FIND: Tier ${state.gearTiers[loot.gearDrop]} ${GEAR_TIER_DEFS[loot.gearDrop].label} — equipped on the spot!`); }
      if(loot.premium) updateContractProgress('premiumfind', { amount: 1 });
      const zoneTierIndex = ZONES.findIndex(z => z.id === loot.zone.id);
      updateContractProgress('zonetier', { zoneTierIndex });
      resultText = parts.join(', ');
      floatColor = loot.gearDrop ? 'var(--gold)' : (loot.premium || loot.rareFind) ? '#F2C94C' : 'var(--cardio)';
      const raidResult = maybeTriggerRaid(zoneTierIndex);
      if(raidResult){
        resultText += ` — something happened back at the base while you were out. Check the Factory.`;
        floatColor = raidResult.repelled ? floatColor : 'var(--danger)';
      }
    }
    state.avatar.speedMinutesCum += durationMin;
  } else if(category === 'strength'){
    const laborGain = Math.max(1, Math.round(LABOR_K * durationMin * INTENSITY_MULT[intensity] * getAvatarStrengthMult() * getBonusMultiplier('labor')));
    state.labor += laborGain;
    updateContractProgress('labor', { amount: laborGain });
    resultText = `+${laborGain} Labor`;
    floatColor = 'var(--arbeid)';
  } else if(category === 'flexibility'){
    const energyGain = Math.max(1, Math.round(ENERGY_K * durationMin * INTENSITY_MULT[intensity] * getAvatarEnergyMult() * getBonusMultiplier('energy')));
    state.energy += energyGain;
    state.avatar.energyMinutesCum += durationMin;
    updateContractProgress('energy', { amount: energyGain });
    resultText = `+${energyGain} Energy`;
    floatColor = 'var(--energi)';
  }
  const zoneName = category === 'cardio' ? (ZONES.find(z=>z.id===zoneId)||ZONES[0]).name : null;
  state.history.unshift({ date:new Date().toISOString(), category, durationMin, intensity, activityLabel: activityLabel||null, zoneName, resultText, failed });
  trimHistory();
  checkStockpileContracts();
  saveState(); render();
  return { resultText, floatColor, failed };
}

function sellResource(key, qty){
  if(qty <= 0 || state.resources[key] < qty) return 'insufficient';
  const sellCost = hasTech('basic_logistics') ? 0 : SELL_LABOR_COST;
  if(state.labor < sellCost) return 'nolabor';
  state.resources[key] -= qty;
  state.labor -= sellCost;
  const gained = Math.round(qty * RESOURCE_DEFS[key].sell * getBonusMultiplier('sell'));
  state.gold += gained;
  updateContractProgress('sell', { resource:key, amount:qty });
  checkStockpileContracts();
  saveState(); render();
  return { gained };
}

function buyResource(key, qty){
  if(qty <= 0) return 'invalid';
  const price = RESOURCE_DEFS[key].sell * BUY_PRICE_MULT;
  const cost = price * qty;
  if(state.gold < cost) return 'insufficient';
  state.gold -= cost;
  state.resources[key] += qty;
  checkStockpileContracts();
  saveState(); render();
  return { cost };
}

function buildFurnace(){
  if(state.buildings.furnace.built) return 'owned';
  if(findEmptySlotIndex('furnace') === -1) return 'nocapacity';
  const c = FURNACE_BUILD_COST;
  if(state.resources.stone < c.stone || state.resources.iron_ore < c.iron_ore || state.labor < c.labor) return 'insufficient';
  state.resources.stone -= c.stone;
  state.resources.iron_ore -= c.iron_ore;
  state.labor -= c.labor;
  state.avatar.strengthLaborSpentCum += c.labor;
  state.buildings.furnace.built = true;
  assignToSlot('furnace');
  saveState(); render();
  return 'ok';
}

function upgradeFurnace(type){
  if(!state.buildings.furnace.built) return 'nofurnace';
  if(state.buildings.furnace.upgrade) return 'alreadyupgraded';
  const upg = FURNACE_UPGRADES[type];
  if(!upg) return 'invalid';
  if(state.resources.iron < upg.cost.iron || state.gold < upg.cost.gold) return 'insufficient';
  state.resources.iron -= upg.cost.iron;
  state.gold -= upg.cost.gold;
  state.buildings.furnace.upgrade = type;
  saveState(); render();
  return 'ok';
}

function tryProcessFurnaceUnits(qty){
  const refineCost = getRefineCost();
  const laborCost = refineCost.labor * qty;
  const energyCost = refineCost.energy * qty;
  if(state.resources.iron_ore < qty || state.labor < laborCost || state.energy < energyCost) return false;
  state.resources.iron_ore -= qty;
  state.labor -= laborCost;
  state.energy -= energyCost;
  state.avatar.strengthLaborSpentCum += laborCost;
  state.resources.iron += qty;
  updateContractProgress('refine', { resource:'iron', amount: qty });
  return true;
}
function refineIron(qty){
  if(!state.buildings.furnace.built) return 'nofurnace';
  if(state.energy <= 0) return 'nopower';
  if(!tryProcessFurnaceUnits(qty)) return 'insufficient';
  checkStockpileContracts();
  saveState(); render();
  return 'ok';
}

function getEmergencyQuotaCost(){
  return EMERGENCY_QUOTA_BASE_COST + state.emergencyQuotaBuysThisWeek * EMERGENCY_QUOTA_SURGE;
}
function buyEmergencyQuota(){
  const cost = getEmergencyQuotaCost();
  if(state.gold < cost) return false;
  state.gold -= cost;
  state.energy += EMERGENCY_QUOTA_GAIN;
  state.emergencyQuotaBuysThisWeek += 1;
  checkStockpileContracts();
  saveState(); render();
  return true;
}

function logNutrition(actionId){
  ensureNutritionDay();
  const action = NUTRITION_ACTIONS.find(a => a.id === actionId);
  if(state.nutritionCounts[actionId] >= action.dailyCap) return 'capped';
  state.nutritionCounts[actionId] += 1;
  const gain = Math.round(action.researchGain * getAvatarResearchMult());
  state.resources.research = (state.resources.research||0) + gain;
  state.avatar.researchEarnedCum += gain;
  saveState(); render();
  return 'ok';
}

function spawnFloatingGain(text, color){
  const el = document.createElement('div');
  el.className = 'float-gain';
  el.style.color = color;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1350);
}

  document.getElementById('goldIcon').style.color = 'var(--gold)';

  document.getElementById('laborIcon').innerHTML = ICONS.labor;
  document.getElementById('laborIcon').style.color = 'var(--arbeid)';

  energyReadout.style.color = energyLow ? 'var(--danger)' : 'var(--energi)';

    : '';

    <div class="stockpile-item">

      <span class="label">${d.label}</span>
      <span class="qty">${state.resources[k]}</span>
    </div>
  `).join('');

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));

  const panel = document.getElementById('panelContent');

  if(activeTab === 'factory') panel.innerHTML = renderFactory();
  if(activeTab === 'shop') panel.innerHTML = renderShop();
  if(activeTab === 'avatar') panel.innerHTML = renderAvatar();
  if(activeTab === 'zones') panel.innerHTML = renderZones();
  if(activeTab === 'contracts') panel.innerHTML = renderContracts();
  if(activeTab === 'nutrition') panel.innerHTML = renderNutrition();
  if(activeTab === 'research') panel.innerHTML = renderResearch();
  if(activeTab === 'history') panel.innerHTML = renderHistory();

  attachPanelHandlers();
}

function costLineFor(costObj){
  return Object.entries(costObj).map(([k,amt]) => {
    const label = k==='gold' ? 'Gold' : k==='labor' ? 'Labor' : k==='energy' ? 'Energy' : RESOURCE_DEFS[k].label;
    const icon = k==='gold' ? 'gold' : k==='labor' ? 'labor' : k==='energy' ? 'energy' : RESOURCE_DEFS[k].icon;
    const color = k==='gold' ? 'var(--gold)' : k==='labor' ? 'var(--arbeid)' : k==='energy' ? 'var(--energi)' : RESOURCE_DEFS[k].color;
    return `<span>${iconSpan(icon,12,color)} ${amt} ${label}</span>`;
  }).join('');
}

function renderGenericBuilding(id){
  const b = BUILDINGS_DEF[id];
  if(!meetsRequirement(b)) return '';
  const bs = state.buildings[id];
  if(!bs.built){
    if(!meetsInfrastructure(b)){
      const missing = b.requiresInfrastructure.filter(k => !state.infrastructure[k]).map(k => INFRASTRUCTURE[k].name);
      return `
        <h3 class="section">${iconSpan(b.icon,16,'var(--ink-dim)')}${b.name} <span style="color:var(--danger); font-weight:400; font-size:12px;">(locked)</span></h3>
        <div class="market-block"><div class="cost-line">Requires: ${missing.join(', ')} — see Infrastructure above.</div></div>`;
    }
    const canBuild = canAffordCost(b.buildCost);
    const atCapacity = findEmptySlotIndex(id) === -1;
    return `
      <h3 class="section">${iconSpan(b.icon,16,'var(--gold)')}${b.name}</h3>
      <div class="market-block">
        <div class="cost-line">One-time build cost: ${costLineFor(b.buildCost)}</div>
        ${atCapacity ? `<div class="cost-line" style="color:var(--danger);">Factory is at capacity — upgrade Factory Size above first.</div>` : ''}
        <button class="primary" data-build="${id}" ${(canBuild && !atCapacity)?'':'disabled'}>${atCapacity ? 'No space' : canBuild?'Build '+b.name:'Missing resources'}</button>
      </div>`;
  }
  const activeUpgrade = getActiveUpgrade(id);
  const upgradeTag = activeUpgrade ? ` <span style="color:var(--ink-dim); font-weight:400; font-size:12px;">(${activeUpgrade.name})</span>` : '';
  const drain = activeUpgrade ? activeUpgrade.dailyDrain : b.baseDrain;
  const drainTag = b.passiveEnergyGen
    ? `<span style="color:var(--kjerne);">+${b.passiveEnergyGen} energy/day, automatic</span>`
    : `${drain} energy/day upkeep`;

  let recipesHtml;
  if(b.recipes.length === 0 && b.passiveEnergyGen){
    recipesHtml = `<div class="market-block"><div class="cost-line">Generates ${b.passiveEnergyGen} Energy per day on its own — no action needed.</div></div>`;
  } else {
    recipesHtml = b.recipes.map(r => {
      const effectiveCost = (activeUpgrade && activeUpgrade.recipeOverride) ? activeUpgrade.recipeOverride : r.cost;
      const byproductLine = (activeUpgrade && activeUpgrade.byproductChance)
        ? `<div class="cost-line">${Math.round(activeUpgrade.byproductChance*100)}% chance of a bonus ${RESOURCE_DEFS[activeUpgrade.byproductResource].label} per unit</div>` : '';
      return `
        <div class="market-block">
          <h3>${r.name}</h3>
          <div class="cost-line">Consumes per unit: ${costLineFor(r.input)}</div>
          <div class="cost-line">Also costs: ${effectiveCost.labor} Labor + ${effectiveCost.energy} Energy per unit</div>
          ${byproductLine}
          <label>Quantity</label>
          <input type="number" id="recipeQty_${id}_${r.id}" value="1" min="1">
          <button class="primary small" data-recipe-building="${id}" data-recipe-id="${r.id}" ${state.energy<=0?'disabled':''}>${state.energy<=0?'Powerless':'Process'}</button>
        </div>`;
    }).join('');
  }

  let upgradeSection = '';
  if(b.upgrades && !bs.upgrade){
    const cards = Object.entries(b.upgrades).map(([upgId, upg]) => {
      const canUpg = canAffordCost(upg.cost);
      return `
        <div class="market-block">
          <h3>${upg.name}</h3>
          <div class="cost-line">${upg.desc}</div>
          <div class="cost-line">Cost: ${costLineFor(upg.cost)}</div>
          <button class="primary small" data-generic-upgrade="${id}:${upgId}" ${canUpg?'':'disabled'}>Build ${upg.name}</button>
        </div>`;
    }).join('');
    upgradeSection = `<h3 class="section">Choose an Upgrade Path <span style="color:var(--danger); font-weight:400; font-size:11px;">(permanent, pick one)</span></h3>${cards}`;
  }

  const demolishTag = renderDemolishControl(id);
  return `<h3 class="section">${iconSpan(b.icon,16,'var(--gold)')}${b.name}${upgradeTag} <span style="color:var(--ink-dim); font-weight:400; font-size:12px;">(${drainTag})</span>${demolishTag}</h3>${recipesHtml}${upgradeSection}`;
}

function getConveyorNodeList(){

function conveyorNodeLabel(id){

function handleConveyorNodeClick(nodeId){
  if(nodeId === 'trader' && !conveyorSelection.from) return;
  if(nodeId === 'loot' && conveyorSelection.from) return;
  if(!conveyorSelection.from){ conveyorSelection.from = nodeId; }
  else if(conveyorSelection.from === nodeId){ conveyorSelection.from = null; conveyorSelection.to = null; }
  else if(!conveyorSelection.to){ conveyorSelection.to = nodeId; }
  else { conveyorSelection.from = nodeId; conveyorSelection.to = null; }

}
function handleFloorNodeClick(kind, value){
  if(floorMode === 'arrange'){
    if(kind !== 'slot') return; // Looting/Trader aren't physical slots, nothing to rearrange there
    if(slotSelection === null){ slotSelection = value; render(); }
    else if(slotSelection === value){ slotSelection = null; render(); }
    else { swapSlots(slotSelection, value); slotSelection = null; }
    return;
  }
  let nodeId;
  if(kind === 'special'){ nodeId = value; }
  else { const b = state.factorySlots[value]; if(!b) return; nodeId = isTurretSlotValue(b) ? ('turretslot:'+value) : b; }
  handleConveyorNodeClick(nodeId);
}
const NODE_STICKERS = { furnace: STICKER_FURNACE };
function renderFactoryFloorDiagram(){
  const boxW = 108, boxH = 44, cols = 4, gapX = 14, gapY = 16, startX = 15;
  const interiorRows = Math.ceil(MAX_INTERIOR_SLOTS / cols);
  const gridWidth = cols*(boxW+gapX) - gapX;
  const wallWidth = MAX_WALL_SLOTS*(boxW+gapX) - gapX;
  const contentWidth = Math.max(gridWidth, wallWidth, boxW);

  const lootY = 15;
  const interiorStartY = lootY + boxH + 30;
  const wallStartY = interiorStartY + interiorRows*(boxH+gapY) + 20;
  const wallLineY = wallStartY + boxH + 12;
  const traderY = wallLineY + 22;
  const svgH = traderY + boxH + 15;
  const lootX = startX + (contentWidth-boxW)/2;
  const traderX = lootX;
  const raidX = traderX + boxW + gapX;
  const svgW = Math.max(contentWidth + startX*2, raidX + boxW + startX);

  const pos = { loot:{x:lootX,y:lootY}, trader:{x:traderX,y:traderY} };
  for(let i=0; i<MAX_TOTAL_SLOTS; i++){
    const buildingId = state.factorySlots[i];
    if(!buildingId) continue;
    let x,y;
    if(!slotIsWall(i)){
      const col=i%cols, row=Math.floor(i/cols);
      x = startX + (contentWidth-gridWidth)/2 + col*(boxW+gapX); y = interiorStartY + row*(boxH+gapY);
    } else {
      const wi = i-MAX_INTERIOR_SLOTS;
      x = startX + (contentWidth-wallWidth)/2 + wi*(boxW+gapX); y = wallStartY;
    }
    pos[buildingId] = { x, y };
    if(isTurretSlotValue(buildingId)) pos['turretslot:'+i] = { x, y };
  }

  let lines = '';
  state.conveyors.forEach(conv => {
    const fromId = RESOURCE_SOURCE_BUILDING[conv.resource] || 'loot';
    const p1 = pos[fromId], p2 = pos[conv.to];
    if(!p1 || !p2) return;
    const x1=p1.x+boxW/2, y1=p1.y+boxH, x2=p2.x+boxW/2, y2=p2.y, midY=(y1+y2)/2;
    lines += `<path d="M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}" fill="none" stroke="var(--gold)" stroke-width="2" class="belt-line"/>`;
    lines += `<circle cx="${x1}" cy="${y1}" r="3" fill="var(--gold)"/><circle cx="${x2}" cy="${y2}" r="3" fill="var(--gold)"/>`;
  });

  function specialNode(kind, x, y, label, edgeColor){
    const selected = floorMode==='connect' && (conveyorSelection.from===kind || conveyorSelection.to===kind);
    return `<g class="floor-node ${selected?'selected':''}" data-kind="special" data-value="${kind}">
      <rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="5" fill="var(--panel-2)" stroke="${edgeColor}" stroke-width="2"/>
      <text x="${x+boxW/2}" y="${y+boxH/2+4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${label}</text>
    </g>`;
  }
  let boxes = specialNode('loot', lootX, lootY, 'Looting', 'var(--cardio)');
  boxes += specialNode('trader', traderX, traderY, 'Trader', 'var(--line)');
  boxes += (function(){
    const last = state.raidHistory[0];
    const isFresh = last && last.lootRunNumber === state.lootRunsCompleted;
    const raidColor = !isFresh ? 'var(--line)' : last.repelled ? 'var(--kjerne)' : 'var(--danger)';
    const raidStatus = !last ? 'None yet' : !isFresh ? 'Quiet' : last.repelled ? 'Repelled' : 'Breach!';
    return `<g>
      <rect x="${raidX}" y="${traderY}" width="${boxW}" height="${boxH}" rx="5" fill="var(--panel-2)" stroke="${raidColor}" stroke-width="2" stroke-dasharray="${isFresh?'0':'4 3'}"/>
      <text x="${raidX+boxW/2}" y="${traderY+18}" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="var(--ink)" font-family="IBM Plex Mono, monospace">RAID</text>
      <text x="${raidX+boxW/2}" y="${traderY+34}" text-anchor="middle" font-size="9" fill="${raidColor}" font-family="IBM Plex Mono, monospace">${raidStatus}</text>
    </g>`;
  })();

  for(let i=0; i<MAX_TOTAL_SLOTS; i++){
    const isWall = slotIsWall(i);
    const unlocked = isSlotUnlocked(i);
    let x,y;
    if(!isWall){ const col=i%cols, row=Math.floor(i/cols); x=startX+(contentWidth-gridWidth)/2+col*(boxW+gapX); y=interiorStartY+row*(boxH+gapY); }
    else { const wi=i-MAX_INTERIOR_SLOTS; x=startX+(contentWidth-wallWidth)/2+wi*(boxW+gapX); y=wallStartY; }
    if(!unlocked){
      boxes += `<g opacity="0.3"><rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="5" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${x+boxW/2}" y="${y+boxH/2+3}" text-anchor="middle" font-size="9" fill="var(--ink-dim)" font-family="IBM Plex Mono, monospace">Locked</text></g>`;
      continue;
    }
    const buildingId = state.factorySlots[i];
    const borderColor = isWall ? 'var(--danger)' : 'var(--line)';
    const selected = floorMode==='arrange' && slotSelection===i;
    if(!buildingId){
      boxes += `<g class="floor-node ${selected?'selected':''}" data-kind="slot" data-value="${i}"><rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="5" fill="var(--panel-2)" stroke="${borderColor}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75"/><text x="${x+boxW/2}" y="${y+boxH/2+3}" text-anchor="middle" font-size="9" fill="var(--ink-dim)" font-family="IBM Plex Mono, monospace">${isWall?'Wall slot':'Empty'}</text></g>`;
      continue;
    }
    if(isTurretSlotValue(buildingId)){
      const tTier = turretTierFromSlotValue(buildingId);
      const tDef = TURRET_DEFS[tTier];
      const ammo = state.turretAmmo[i] || 0;
      const ammoPct = Math.round((ammo/tDef.ammoCap)*100);
      const ammoColor = ammo===0 ? 'var(--danger)' : 'var(--fleks)';
      const turretConnectSelected = floorMode==='connect' && (conveyorSelection.from===('turretslot:'+i) || conveyorSelection.to===('turretslot:'+i));
      boxes += `<g class="floor-node ${(selected||turretConnectSelected)?'selected':''}" data-kind="slot" data-value="${i}">
        <rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="5" fill="var(--panel-2)" stroke="var(--danger)" stroke-width="2"/>
        <text x="${x+boxW/2}" y="${y+18}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">T${tDef.tier} Turret</text>
        <rect x="${x+6}" y="${y+26}" width="${boxW-12}" height="5" fill="var(--bg-void)" stroke="var(--line)" stroke-width="1"/>
        <rect x="${x+6}" y="${y+26}" width="${Math.max(2,(boxW-12)*ammoPct/100)}" height="5" fill="${ammoColor}"/>
        <text x="${x+boxW/2}" y="${y+40}" text-anchor="middle" font-size="8" fill="var(--ink-dim)" font-family="IBM Plex Mono, monospace">${ammo}/${tDef.ammoCap} ammo</text>
      </g>`;
      continue;
    }
    const label = getNodeDisplayLabel(buildingId);
    const sticker = NODE_STICKERS[buildingId];
    const connectSelected = floorMode==='connect' && (conveyorSelection.from===buildingId || conveyorSelection.to===buildingId);
    const imageEl = sticker ? `<image href="${sticker}" x="${x+2}" y="${y+2}" width="${boxH-4}" height="${boxH-4}" style="pointer-events:none;"/>` : '';
    const textX = sticker ? x+boxH+4 : x+boxW/2;
    const textAnchor = sticker ? 'start' : 'middle';
    boxes += `<g class="floor-node ${(selected||connectSelected)?'selected':''}" data-kind="slot" data-value="${i}"><rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="5" fill="var(--panel-2)" stroke="${borderColor}" stroke-width="2"/>${imageEl}<text x="${textX}" y="${y+boxH/2+4}" text-anchor="${textAnchor}" font-size="9.5" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${label}</text></g>`;
  }

  const wallLine = `<line x1="${startX}" y1="${wallLineY}" x2="${startX+contentWidth}" y2="${wallLineY}" stroke="var(--danger)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/><text x="${startX}" y="${wallLineY-5}" font-size="9" letter-spacing="1" fill="var(--danger)" font-family="IBM Plex Mono, monospace">WALL</text>`;

  return `<div style="overflow-x:auto; margin-bottom:10px;"><svg viewBox="0 0 ${svgW} ${svgH}" style="width:${svgW}px; height:auto; display:block;">${lines}${wallLine}${boxes}</svg></div>`;
}

function renderTurretSection(){

    return `

      </div>`;

  const built = getBuiltTurrets();

    const ammo = state.turretAmmo[t.slotIndex] || 0;
    return `
      <div class="conveyor-list-row">

    ${built.length ? `<h3 class="section" style="font-size:14px;">Manage Turrets</h3>${manageRows}` : ''}

}
function renderRaidReport(){
  const last = state.raidHistory[0];
  if(!last) return `<div class="section-note">No raids yet — that box will fill in once one happens. They become possible after your 5th successful loot run.</div>`;
  const isFresh = last.lootRunNumber === state.lootRunsCompleted;
  const zone = ZONES[last.zoneTierIndex];
  const zoneName = zone ? zone.name : '?';
  const prefix = isFresh ? 'Raid just now' : `No raid this time — all quiet. Last one was ${state.lootRunsCompleted - last.lootRunNumber} loot run(s) ago`;
  if(last.repelled){
    return `<div class="section-note" style="color:${isFresh?'var(--kjerne)':'var(--ink-dim)'};">${prefix}: ${last.wave.raiderCount} raiders (${last.wave.totalHP} HP) out of ${zoneName} — repelled at the wall.</div>`;
  }
  const c = last.consequence;
  let detail = 'found nothing worth taking';
  if(c.type==='stolen') detail = `stole ${c.amount} ${RESOURCE_DEFS[c.resource].label}`;
  else if(c.type==='turret_destroyed') detail = `destroyed your ${c.name}`;
  else if(c.type==='building_destroyed') detail = `burned down your ${c.name}`;
  return `<div class="section-note" style="color:${isFresh?'var(--danger)':'var(--ink-dim)'};">${prefix}: ${last.wave.raiderCount} raiders (${last.wave.totalHP} HP) out of ${zoneName} broke through — they ${detail}.</div>`;
}

}

function renderAvatar(){
  function levelBlock(name, icon, color, levels, cumValue, gearTier, unit){
    const grindLvl = getAvatarLevel(levels, cumValue);
    const effLvl = getEffectiveLevel(levels, cumValue, gearTier);
    const cur = levels[effLvl];
    const nextGrind = levels[grindLvl+1];
    const pct = nextGrind ? Math.min(100, Math.round(((cumValue-levels[grindLvl].min)/(nextGrind.min-levels[grindLvl].min))*100)) : 100;
    const gearNote = gearTier > 0 ? ` <span style="color:var(--gold); font-weight:400; font-size:12px;">(Grind ${grindLvl+1} + Gear Tier ${gearTier})</span>` : '';
    return `
      <div class="avatar-card">
        <div class="avatar-top">
          <div class="node-name" style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;">${iconSpan(icon,18,color)}${name} — Level ${effLvl+1}${gearNote}</div>
          <div class="avatar-mult">×${cur.mult.toFixed(2)}</div>
        </div>
        <div class="avatar-bar"><div class="avatar-bar-fill" style="width:${pct}%; background:${color};"></div></div>
        <div class="avatar-progress-text">${nextGrind ? cumValue + ' / ' + nextGrind.min + ' ' + unit + ' to next grind level' : 'Max grind level reached (' + cumValue + ' ' + unit + ')'}</div>
      </div>`;
  }
  function gearCard(category){
    const def = GEAR_TIER_DEFS[category];
    const tier = state.gearTiers[category];
    const maxed = tier >= 4;
    const nextCost = maxed ? null : def.tierCosts[tier];
    const have = state.resources[def.resource] || 0;
    const canUpgrade = !maxed && have >= nextCost;
    return `
      <div class="market-block">
        <h3>${def.label} — Tier ${tier}/4</h3>
        <div class="cost-line">Each tier adds +1 effective level to this stat — same system as real training, just a shortcut.</div>
        ${!maxed
          ? `<div class="cost-line">Next tier needs ${nextCost} ${RESOURCE_DEFS[def.resource].label} (have ${have})</div><button class="primary small" data-gear-tier="${category}" ${canUpgrade?'':'disabled'}>Upgrade to Tier ${tier+1}</button>`
          : `<div class="cost-line" style="color:var(--kjerne);">Maxed out.</div>`}
      </div>`;
  }
  return `
    <h2>Avatar</h2>
    ${renderAvatarStyleChooser()}
    ${renderAvatarFigure()}
    <div class="section-note" style="text-align:center;">Gear tiers show up on your Avatar as you earn them — permanent multipliers built up over time from real training and real work in the factory.</div>
    ${levelBlock('Speed', 'cardio', 'var(--cardio)', SPEED_LEVELS, state.avatar.speedMinutesCum, state.gearTiers.loot, 'min cardio')}
    ${levelBlock('Strength', 'strength', 'var(--styrke)', STRENGTH_LEVELS, state.avatar.strengthLaborSpentCum, state.gearTiers.labor, 'labor spent')}
    ${levelBlock('Energy', 'flexibility', 'var(--energi)', ENERGY_LEVELS, state.avatar.energyMinutesCum, state.gearTiers.energy, 'min flexibility')}
    ${levelBlock('Research', 'lightbulb', 'var(--kjerne)', RESEARCH_LEVELS, state.avatar.researchEarnedCum, state.gearTiers.research, 'research earned')}
    <div class="section-note">Strength grows from Labor you actually <em>spend</em> in the factory — not from earning it. Speed also determines which Zones you can reach.</div>

    <h3 class="section">${iconSpan('avatar',16,'var(--gold)')}Gear</h3>
    ${GEAR_CATEGORIES.map(gearCard).join('')}
    <div class="feedback" id="gearFeedback"></div>
  `;
}
